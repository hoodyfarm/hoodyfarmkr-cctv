rules:
  species: cattle
  target_classes:
  - cow
  - person
  - dog
  - standing
  - lying_sternal
  - lying_lateral
  - mounting
  confidence_threshold: 0.25
  event_codes:
  - INVERTED
  - CATTLE_INVERTED
  - CATTLE_COLIC_SUSPECTED
  - CALVING
  - ESCAPE
  - ESTRUS
  - FIGHTING
  - INTRUSION
  - FIRE
  - NORMAL
  cooldown_sec: 10.0
  pre_event_sec: 5.0
  post_event_sec: 5.0
  vision_prompt: 'Analyze this CCTV camera frame carefully. Detect cattle, animals,
    or humans in the farm. Identify behavior and anomalies, and classify into event_type:
    ''INVERTED'' (기립불능, 뒤집힘, 넘어져서 못 일어남), ''CALVING'' (분만 임박, 양수 파수, 출산 징후), ''ESCAPE''
    (울타리 이탈, 축사 탈출), ''ESTRUS'' (발정 승가), ''FIGHTING'' (투쟁), ''INTRUSION'' (외부인 침입),
    ''FIRE'' (화재 연기), or ''NORMAL'' (정상). Set event_type to one of these uppercase
    codes. Provide the output strictly matching the required JSON schema with summary
    in Korean.'
storage:
  media_priority:
  - drive
  - tailscale
  - oci
  spool_retention_minutes: 15
  event_retention_days: 7
  max_total_mb: 2048
notification:
  fms_webhook_url: ${FMS_WEBHOOK_URL:-}
  tailscale_host_url: ${TAILSCALE_HOST_URL:-}
  timeout_sec: 4.0
